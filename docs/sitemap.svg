  <rect x="560" y="150" width="140" height="50" rx="8" fill="#EAF6E7" stroke="#2E7D32" stroke-width="2"/>
  <text x="630" y="172" font-family="Arial, sans-serif" font-size="14" fill="#222222" text-anchor="middle">Contact</text>
  <text x="630" y="188" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">contact.html</text>

  <!-- Legend -->
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">All pages share the same header (logo + navigation menu) and footer.</text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">Navigation links connect every page to every other page (not shown, to avoid clutter).</text>

  <!-- Nav bar illustration -->
  <rect x="130" y="320" width="540" height="40" rx="4" fill="#2E7D32"/>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Home | About Us | Our Programmes | Enquiry | Contact</text>
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">Global navigation menu (present in the header of every page)</text>
